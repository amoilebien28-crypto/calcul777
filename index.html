<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculatrice Secrète</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --calc-bg: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #3b82f6;
            --equal-bg: #10b981;
            --operator-bg: #f59e0b;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .calculator {
            background-color: var(--calc-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            width: 100%;
            max-width: 360px;
            overflow: hidden;
            padding: 20px;
        }

        .display {
            background-color: #0f172a;
            color: var(--text-primary);
            font-size: 24px;
            padding: 20px;
            text-align: right;
            border-radius: 12px;
            margin-bottom: 20px;
            min-height: 70px;
            word-break: break-all;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            border: 1px solid #334155;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        button {
            background-color: #334155;
            color: var(--text-primary);
            border: none;
            padding: 18px;
            font-size: 18px;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover { background-color: #475569; }
        .btn-operator { background-color: var(--operator-bg); color: white; }
        .btn-operator:hover { background-color: #d97706; }
        .btn-equal { background-color: var(--equal-bg); color: white; grid-column: span 2; }
        .btn-equal:hover { background-color: #059669; }
        .btn-clear { background-color: var(--danger); color: white; }
        .btn-clear:hover { background-color: #dc2626; }

        /* Style du panneau Admin */
        .admin-panel {
            display: none;
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            margin-top: 15px;
            border: 1px solid var(--accent);
        }
        .admin-panel h3 { margin-bottom: 12px; font-size: 16px; color: var(--accent); }
        .admin-panel label { font-size: 12px; color: var(--text-secondary); display: block; margin-bottom: 4px; }
        .admin-panel input {
            width: 100%;
            padding: 8px 10px;
            margin-bottom: 10px;
            background: #0f172a;
            border: 1px solid #475569;
            color: white;
            border-radius: 6px;
            font-size: 14px;
        }
        .admin-panel button {
            width: 100%;
            padding: 10px;
            background: var(--accent);
            font-size: 14px;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <div class="calculator">
        <div id="display" class="display">0</div>
        
        <div class="buttons">
            <button class="btn-clear" onclick="clearDisplay()">C</button>
            <button onclick="appendValue('(')">(</button>
            <button onclick="appendValue(')')">)</button>
            <button class="btn-operator" onclick="appendValue('/')">/</button>
            
            <button onclick="appendValue('7')">7</button>
            <button onclick="appendValue('8')">8</button>
            <button onclick="appendValue('9')">9</button>
            <button class="btn-operator" onclick="appendValue('*')">*</button>
            
            <button onclick="appendValue('4')">4</button>
            <button onclick="appendValue('5')">5</button>
            <button onclick="appendValue('6')">6</button>
            <button class="btn-operator" onclick="appendValue('-')">-</button>
            
            <button onclick="appendValue('1')">1</button>
            <button onclick="appendValue('2')">2</button>
            <button onclick="appendValue('3')">3</button>
            <button class="btn-operator" onclick="appendValue('+')">+</button>
            
            <button onclick="appendValue('0')">0</button>
            <button onclick="appendValue('.')">.</button>
            <button class="btn-equal" onclick="calculate()">=</button>
        </div>

        <!-- Tableau de bord Administrateur complet -->
        <div id="adminPanel" class="admin-panel">
            <h3>⚙️ Panneau Admin</h3>
            
            <label>Nouveau code Admin (ex: 3+3+3 ou 41) :</label>
            <input type="text" id="adminCodeInput">

            <label>Nouveau code du Jeu (ex: 1+2+3) :</label>
            <input type="text" id="gameCodeInput">

            <label>URL du jeu distant :</label>
            <input type="text" id="gameUrlInput">

            <button onclick="saveAdminSettings()">Enregistrer les modifications</button>
        </div>
    </div>

    <script>
        let currentExpression = "";
        const display = document.getElementById('display');

        // Chargement des codes et de l'URL depuis la mémoire du navigateur (avec valeurs par défaut)
        let adminCode = localStorage.getItem('admin_code') || "3+3+3";
        let gameCode = localStorage.getItem('game_code') || "1+2+3";
        let remoteGameUrl = localStorage.getItem('game_url') || "https://amoilebien28-crypto.github.io/calcul777/jeu.html";

        function appendValue(val) {
            if (currentExpression === "" && val !== '.') {
                currentExpression = val;
            } else {
                currentExpression += val;
            }
            display.textContent = currentExpression;
        }

        function clearDisplay() {
            currentExpression = "";
            display.textContent = "0";
            document.getElementById('adminPanel').style.display = 'none';
        }

        function calculate() {
            if (!currentExpression) return;

            let cleanExpr = currentExpression.replace(/\s+/g, '');

            // 1. Vérification du code Admin
            if (cleanExpr === adminCode) {
                document.getElementById('adminPanel').style.display = 'block';
                // Remplir les champs avec les valeurs actuelles
                document.getElementById('adminCodeInput').value = adminCode;
                document.getElementById('gameCodeInput').value = gameCode;
                document.getElementById('gameUrlInput').value = remoteGameUrl;
                display.textContent = "ADMIN OK";
                return;
            }

            // 2. Vérification du code du Jeu
            if (cleanExpr === gameCode) {
                display.textContent = "Lancement...";
                window.location.href = remoteGameUrl;
                return;
            }

            // 3. Calcul mathématique normal
            try {
                let result = eval(currentExpression);
                display.textContent = result;
                currentExpression = result.toString();
            } catch (error) {
                display.textContent = "Erreur";
                currentExpression = "";
            }
        }

        function saveAdminSettings() {
            const newAdminCode = document.getElementById('adminCodeInput').value.replace(/\s+/g, '');
            const newGameCode = document.getElementById('gameCodeInput').value.replace(/\s+/g, '');
            const newUrl = document.getElementById('gameUrlInput').value;

            if (newAdminCode && newGameCode && newUrl) {
                localStorage.setItem('admin_code', newAdminCode);
                localStorage.setItem('game_code', newGameCode);
                localStorage.setItem('game_url', newUrl);

                adminCode = newAdminCode;
                gameCode = newGameCode;
                remoteGameUrl = newUrl;

                alert("Paramètres enregistrés avec succès !");
                clearDisplay();
            } else {
                alert("Veuillez remplir tous les champs correctement.");
            }
        }
    </script>
</body>
</html>
